<!DOCTYPE html>

<html lang="en">

    <head>

        <meta charset="utf-8">
        <meta name="viewport" content="initial-scale=1, width=device-width">

        <!-- http://getbootstrap.com/docs/5.3/ -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <link href="static/styles.css" rel="stylesheet">


        <title>Blackjack: {% block title %}{% endblock %}</title>

    </head>
     <!-- https://www.freepik.com/premium-photo/green-poker-table-felt-background-with-shade-vignette_3935938.htm -->
    <!-- playing cards from https://acbl.mybigcommerce.com/52-playing-cards/-->
    <style>

        body {
          background-image: url('static/cards/background.png');
        }
        </style>

    <body>
        <h1 style = " text-align: center">Dealer's Cards</h1>

        <h1 class = "centerheader">Player's Cards</h1>
        {% for img in playerimg %}
            <img class = "card-player{{loop.index}}" src = "static/cards/{{img}}.png" alt = "player card">
        {% endfor %}
        {% for img in dealerimg %}
        <img class = "card-dealer{{loop.index}}" src = "static/cards/{{img}}.png" alt = "dealer card">
        {% endfor %}
        <form id = "home" action="/"method = "get">
            <button class="btn btn-primary" type="submit">home</button>
        </form>
        <h2 class = "footer">{{result}}</h2>
    </body>
